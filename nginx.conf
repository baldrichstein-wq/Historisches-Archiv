server {
    listen 80;
    server_name localhost;

    # Prevent dropping the port on redirects (relative redirects)
    absolute_redirect off;

    location /archiv/ {
        alias /usr/share/nginx/html/archiv/;
        index index.html;
        try_files $uri $uri/ /archiv/index.html;
    }

    # Redirect root / to /archiv/
    location = / {
        return 301 /archiv/;
    }

    # Redirect /archiv to /archiv/ without dropping port
    location = /archiv {
        return 301 /archiv/;
    }
}
