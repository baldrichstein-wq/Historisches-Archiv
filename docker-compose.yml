version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: historisches_archiv_backend
    environment:
      - DATABASE_URL=sqlite:///./data/historisches_archiv.db
    ports:
      - "8091:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: historisches_archiv_web
    ports:
      - "8080:80"
    volumes:
      - ./backend/uploads:/usr/share/nginx/html/archiv/uploads
      - ./image:/usr/share/nginx/html/archiv/image
      - ./Postkarten:/usr/share/nginx/html/archiv/Postkarten
      - ./Vordrucke_fuer_eiserneRationen:/usr/share/nginx/html/archiv/Vordrucke_fuer_eiserneRationen
    restart: unless-stopped

