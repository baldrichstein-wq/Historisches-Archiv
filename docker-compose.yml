version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: historisches_archiv_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: historisches_archiv
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: historisches_archiv_backend
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/historisches_archiv
    ports:
      - "8091:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - postgres
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: historisches_archiv_web
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  postgres_data:
